<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Hunt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Ccircle cx='18' cy='18' r='14' fill='none' stroke='%23e3e6ea' stroke-width='5'/%3E%3Ccircle cx='18' cy='18' r='14' fill='none' stroke='%230B6E99' stroke-width='5' stroke-linecap='round' stroke-dasharray='88' stroke-dashoffset='22' transform='rotate(-90 18 18)'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #F3F4F6; --surface: #FFFFFF; --raised: #FFFFFF;
    --ink: #15171C; --ink-2: #464C5A; --ink-3: #6B7180;
    --hair: rgba(21, 23, 28, .09); --hair-strong: rgba(21, 23, 28, .16);
    --accent: #0B6E99; --accent-ink: #FFFFFF; --accent-wash: rgba(11, 110, 153, .10);
    --good: #1E8A57; --good-wash: rgba(30, 138, 87, .12);
    --low: #A3A8B3;
    --night: #5146C9; --night-wash: rgba(81, 70, 201, .11);
    --warn: #B4541A; --warn-wash: rgba(180, 84, 26, .11);
    --side: rgba(232, 234, 239, .74);
    --sheet-shadow: 0 24px 64px rgba(15, 20, 30, .16), 0 2px 8px rgba(15, 20, 30, .07);
    --row-hover: rgba(21, 23, 28, .035);
    --radius-s: 6px; --radius-m: 10px; --radius-l: 16px;
    --spring: cubic-bezier(.32, .72, 0, 1);
    --side-w: 15.5rem; --detail-w: 27rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #15181D; --surface: #1B1F25; --raised: #22272E;
      --ink: #ECEEF2; --ink-2: #B8BDC8; --ink-3: #8D93A2;
      --hair: rgba(255, 255, 255, .08); --hair-strong: rgba(255, 255, 255, .15);
      --accent: #56B6E0; --accent-ink: #062330; --accent-wash: rgba(86, 182, 224, .14);
      --good: #4CC38A; --good-wash: rgba(76, 195, 138, .14);
      --low: #5E6472;
      --night: #A69DFF; --night-wash: rgba(166, 157, 255, .14);
      --warn: #F0A060; --warn-wash: rgba(240, 160, 96, .13);
      --side: rgba(30, 34, 41, .74);
      --sheet-shadow: 0 24px 64px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
      --row-hover: rgba(255, 255, 255, .035);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 100%/1.5 "Segoe UI Variable Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-s); }
  svg.i { width: 1rem; height: 1rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
          stroke-linecap: round; stroke-linejoin: round; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) var(--detail-w); height: 100vh; }

  /* ---------- Sidebar (heavier material = structural region) ---------- */
  .side {
    background: var(--side); backdrop-filter: blur(24px) saturate(160%);
    border-right: 1px solid var(--hair); display: flex; flex-direction: column; min-height: 0;
  }
  .side-scroll { overflow-y: auto; padding: 1.25rem .75rem 1rem; flex: 1; }
  .brand { padding: 0 .5rem 1.1rem; }
  .brand h1 { font: 650 1.2rem/1.2 "Segoe UI Variable Display", system-ui, sans-serif; letter-spacing: -.015em; margin: 0; }
  .brand p { margin: .15rem 0 0; font-size: .8rem; color: var(--ink-3); }
  .group-label { font-size: .75rem; font-weight: 600; color: var(--ink-3); margin: 1.3rem .5rem .45rem; letter-spacing: .01em; }

  .stage {
    width: 100%; display: flex; align-items: center; gap: .6rem; padding: .45rem .55rem; border-radius: var(--radius-s);
    color: var(--ink-2); font-size: .9rem; transition: background-color 120ms ease, transform 100ms ease-out;
  }
  .stage:hover { background: var(--row-hover); }
  .stage:active { transform: scale(.98); }
  .stage[aria-current="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
  .stage[aria-current="true"] svg { color: var(--accent); }
  .stage .count { margin-left: auto; font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; font-weight: 500; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--hair); border-radius: 8px; padding: 2px; margin: 0 .25rem; }
  .seg button { padding: .32rem .4rem; border-radius: 6px; font-size: .8rem; color: var(--ink-2); transition: background-color 150ms ease, color 150ms ease; }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  .switch { display: flex; align-items: center; gap: .6rem; padding: .45rem .55rem; border-radius: var(--radius-s); font-size: .88rem; color: var(--ink-2); width: 100%; }
  .switch:hover { background: var(--row-hover); }
  .switch .track { margin-left: auto; width: 2rem; height: 1.15rem; border-radius: 99px; background: var(--hair-strong); position: relative; transition: background-color 180ms ease; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(1.15rem - 4px); height: calc(1.15rem - 4px); border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform 220ms var(--spring); }
  .switch[aria-checked="true"] .track { background: var(--accent); }
  .switch[aria-checked="true"] .track::after { transform: translateX(.85rem); }

  .chips { display: flex; flex-wrap: wrap; gap: .35rem; padding: 0 .3rem; }
  .chip-btn { padding: .22rem .6rem; border-radius: 99px; border: 1px solid var(--hair-strong); font-size: .8rem; color: var(--ink-2); transition: background-color 120ms ease, transform 100ms ease-out; }
  .chip-btn:active { transform: scale(.96); }
  .chip-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  .side-foot { padding: .85rem .75rem 1rem; border-top: 1px solid var(--hair); }
  .setup-links { display: grid; gap: .1rem; margin-bottom: .7rem; }
  .setup-links a { display: flex; align-items: center; gap: .6rem; padding: .45rem .55rem; border-radius: var(--radius-s); color: var(--ink-2); font-size: .88rem; text-decoration: none; transition: background-color 120ms ease; }
  .setup-links a:hover { background: var(--row-hover); color: var(--ink); }
  .setup-links a span { margin-left: auto; font-size: .76rem; color: var(--ink-3); max-width: 6.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .resume small { display: block; color: var(--ink-3); font-size: .76rem; }
  .resume-row { display: grid; grid-template-columns: 1fr auto; gap: .5rem; margin-bottom: 1.4rem; }
  .resume-row .resume { margin-bottom: 0; }
  .fetch {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: .5rem; padding: .6rem .8rem;
    border-radius: var(--radius-m); background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: .9rem;
    transition: transform 100ms ease-out, filter 120ms ease;
  }
  .fetch:hover { filter: brightness(1.06); }
  .fetch:active { transform: scale(.97); }
  .fetch:disabled { cursor: progress; filter: saturate(.6); }
  .fetch:disabled svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fetch-status { margin: .55rem .15rem 0; font-size: .78rem; color: var(--ink-3); min-height: 1.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.log { margin-top: .35rem; font-size: .75rem; color: var(--ink-3); }
  details.log summary { cursor: pointer; padding: .1rem .15rem; }
  details.log pre { white-space: pre-wrap; max-height: 10rem; overflow: auto; margin: .4rem 0 0; padding: .55rem; background: var(--hair); border-radius: var(--radius-s); font: .72rem/1.45 ui-monospace, Consolas, monospace; }

  /* ---------- List pane ---------- */
  .list-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
  .list-head {
    position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem;
    padding: 1rem 1.25rem .85rem; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(20px);
  }
  .list-head h2 { font: 650 1.45rem/1.15 "Segoe UI Variable Display", system-ui, sans-serif; letter-spacing: -.02em; margin: 0; flex: 1 1 auto; }
  .list-head h2 small { font: 500 .85rem system-ui, sans-serif; color: var(--ink-3); letter-spacing: 0; margin-left: .4rem; }
  .menu-btn { display: none; width: 2.25rem; height: 2.25rem; border-radius: var(--radius-s); align-items: center; justify-content: center; }
  .menu-btn:hover { background: var(--row-hover); }
  .search { flex: 1 1 100%; display: flex; align-items: center; gap: .5rem; background: var(--paper); border-radius: var(--radius-m); padding: 0 .75rem; color: var(--ink-3); border: 1px solid transparent; transition: border-color 120ms ease; }
  .search:focus-within { border-color: var(--accent); }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: .55rem 0; color: var(--ink); font-size: .92rem; }
  .search kbd { font: .72rem ui-monospace, Consolas, monospace; border: 1px solid var(--hair-strong); border-radius: 4px; padding: 0 .3rem; color: var(--ink-3); }
  .sort { border: 0; background: none; color: var(--ink-2); font-size: .85rem; padding: .2rem; border-radius: var(--radius-s); cursor: pointer; }
  .list-head .fade { position: absolute; left: 0; right: 0; bottom: -12px; height: 12px; pointer-events: none; background: linear-gradient(var(--surface), transparent); opacity: 0; transition: opacity 150ms ease; }
  .list-pane.scrolled .fade { opacity: 1; }

  .list { list-style: none; margin: 0; padding: 0 .6rem 2rem; overflow-y: auto; flex: 1; }
  .row {
    width: 100%; text-align: left; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) auto; gap: .85rem; align-items: center;
    padding: .7rem .7rem; border-radius: var(--radius-m); transition: background-color 120ms ease, transform 100ms ease-out;
  }
  .row:hover { background: var(--row-hover); }
  .row:active { transform: scale(.99); }
  .row[aria-current="true"] { background: var(--accent-wash); }
  .list li + li .row { box-shadow: 0 -1px 0 var(--hair); }
  .list li + li .row[aria-current="true"], .list li[data-sel] + li .row { box-shadow: none; }
  .row-title { font-weight: 600; font-size: .95rem; line-height: 1.3; color: var(--ink); overflow: hidden;
               display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .row-sub { font-size: .82rem; color: var(--ink-2); margin-top: .1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub .co { color: var(--ink); opacity: .85; }
  .row-tags { display: flex; gap: .35rem; margin-top: .4rem; flex-wrap: wrap; }
  .row-side { text-align: right; font-size: .78rem; color: var(--ink-3); white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: .3rem; }
  .fresh { width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent); }

  .tag { display: inline-flex; align-items: center; gap: .3rem; font-size: .74rem; font-weight: 500; padding: .1rem .5rem; border-radius: 99px; background: var(--paper); color: var(--ink-2); }
  .tag svg.i { width: .8rem; height: .8rem; }
  .tag.night { background: var(--night-wash); color: var(--night); }
  .tag.warn { background: var(--warn-wash); color: var(--warn); }

  /* The one bold element: match-score ring */
  .ring { position: relative; width: 2.6rem; height: 2.6rem; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3.2; }
  .ring .bg { stroke: var(--hair); }
  .ring .fg { stroke-linecap: round; transition: stroke-dashoffset 500ms var(--spring); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .8rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .t-hi .fg { stroke: var(--good); } .t-hi b { color: var(--good); }
  .t-mid .fg { stroke: var(--accent); } .t-mid b { color: var(--accent); }
  .t-lo .fg { stroke: var(--low); } .t-lo b { color: var(--ink-3); }

  .empty { text-align: center; padding: 4.5rem 1.5rem; color: var(--ink-3); }
  .empty h3 { color: var(--ink); font-size: 1.05rem; margin: .8rem 0 .3rem; font-weight: 600; }
  .empty p { margin: 0 auto 1.1rem; max-width: 22rem; font-size: .9rem; }
  .empty svg.big { width: 2.2rem; height: 2.2rem; color: var(--low); stroke-width: 1.4; }

  /* ---------- Detail (parallel, non-blocking panel: no scrim on desktop) ---------- */
  .detail { background: var(--surface); border-left: 1px solid var(--hair); overflow-y: auto; min-height: 0; }
  .detail-inner { padding: 1.5rem 1.6rem 2.5rem; }
  .detail-top { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; }
  .back { display: none; align-items: center; gap: .3rem; color: var(--accent); font-weight: 600; font-size: .9rem; padding: .3rem .2rem; }
  .detail-top .ring { width: 3.4rem; height: 3.4rem; }
  .detail-top .ring b { font-size: 1rem; }
  .score-cap { font-size: .8rem; color: var(--ink-3); line-height: 1.3; }
  .score-cap strong { display: block; color: var(--ink); font-size: .88rem; }
  .detail h2 { font: 650 1.55rem/1.15 "Segoe UI Variable Display", system-ui, sans-serif; letter-spacing: -.02em; margin: 0 0 .35rem; text-wrap: balance; }
  .detail .company { font-size: 1rem; color: var(--ink-2); margin: 0 0 1rem; }
  .detail .row-tags { margin: 0 0 1.25rem; }

  .actions { display: grid; grid-template-columns: 1fr auto auto; gap: .5rem; margin-bottom: 1.25rem; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .6rem .9rem; border-radius: var(--radius-m);
    font-weight: 600; font-size: .9rem; text-decoration: none; transition: transform 100ms ease-out, background-color 120ms ease, filter 120ms ease;
    min-height: 2.75rem;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.quiet { background: var(--paper); color: var(--ink); }
  .btn.quiet:hover { background: var(--hair); }
  .btn.quiet[aria-pressed="true"] { color: var(--accent); }

  .status-seg { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: 1.4rem; }
  .status-seg button { font-size: .8rem; padding: .3rem .7rem; border-radius: 99px; border: 1px solid var(--hair-strong); color: var(--ink-2); transition: background-color 120ms ease, transform 100ms ease-out; }
  .status-seg button:active { transform: scale(.96); }
  .status-seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }

  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--hair); border-radius: var(--radius-m); overflow: hidden; margin: 0 0 1.4rem; }
  .facts div { background: var(--surface); padding: .6rem .75rem; min-width: 0; }
  .facts div:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .facts dt { font-size: .74rem; color: var(--ink-3); }
  .facts dd { margin: .05rem 0 0; font-size: .88rem; font-weight: 500; overflow-wrap: anywhere; }
  .detail h3 { font-size: .85rem; font-weight: 600; color: var(--ink-2); margin: 0 0 .5rem; }
  .resume { display: flex; align-items: center; gap: .6rem; padding: .65rem .75rem; border-radius: var(--radius-m); background: var(--paper); color: var(--ink); text-decoration: none; font-size: .88rem; margin-bottom: 1.4rem; transition: background-color 120ms ease; }
  .resume:hover { background: var(--hair); }
  .resume span { color: var(--ink-3); margin-left: auto; font-size: .8rem; }
  textarea.notes { width: 100%; min-height: 4.5rem; resize: vertical; border: 1px solid var(--hair-strong); border-radius: var(--radius-m); background: var(--surface); padding: .6rem .75rem; font-size: .88rem; margin-bottom: 1.4rem; }
  textarea.notes:focus { outline: none; border-color: var(--accent); }
  .desc { font-size: .88rem; line-height: 1.6; color: var(--ink-2); white-space: pre-line; max-width: 68ch; }
  .desc.clamp { max-height: 14rem; overflow: hidden; mask-image: linear-gradient(#000 70%, transparent); }
  .link-btn { color: var(--accent); font-weight: 600; font-size: .85rem; margin-top: .5rem; }
  .keys { margin-top: 2rem; font-size: .76rem; color: var(--ink-3); line-height: 1.9; }
  .keys kbd { font: .7rem ui-monospace, Consolas, monospace; border: 1px solid var(--hair-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 .3rem; margin-right: .2rem; color: var(--ink-2); }
  .placeholder { height: 100%; display: grid; place-items: center; text-align: center; color: var(--ink-3); padding: 2rem; font-size: .9rem; }

  /* ---------- Toast (undo = forgiveness) ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 1.5rem; z-index: 50; display: flex; align-items: center; gap: 1rem;
    padding: .65rem .7rem .65rem 1.1rem; border-radius: var(--radius-l); background: var(--ink); color: var(--paper);
    font-size: .88rem; box-shadow: var(--sheet-shadow);
    transform: translate(-50%, 1.5rem) scale(.96); opacity: 0; pointer-events: none;
    transition: transform 380ms var(--spring), opacity 200ms ease;
  }
  .toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; pointer-events: auto; }
  .toast button { color: var(--paper); font-weight: 650; padding: .3rem .7rem; border-radius: var(--radius-s); background: rgba(127,127,127,.25); }

  .scrim { display: none; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1180px) {
    .app { grid-template-columns: var(--side-w) minmax(0, 1fr); }
    .detail {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--detail-w), 100vw); z-index: 30;
      box-shadow: var(--sheet-shadow); border-left: 0;
      transform: translateX(104%); transition: transform 420ms var(--spring); visibility: hidden;
    }
    body.detail-open .detail { transform: none; visibility: visible; }
    .back { display: inline-flex; }
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .menu-btn { display: inline-flex; }
    .side {
      position: fixed; top: 0; bottom: 0; left: 0; width: min(18rem, 86vw); z-index: 40; background: var(--surface);
      transform: translateX(-104%); transition: transform 420ms var(--spring); visibility: hidden; box-shadow: var(--sheet-shadow);
    }
    body.side-open .side { transform: none; visibility: visible; }
    .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(10, 12, 16, .35); opacity: 0; pointer-events: none; transition: opacity 250ms ease; }
    body.side-open .scrim { opacity: 1; pointer-events: auto; }
    .detail { width: 100vw; }
    .list-head { padding: .75rem 1rem; }
    .row-side .when { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; animation: none !important; }
    .detail, .side { transition: opacity 200ms ease !important; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .side, .list-head { backdrop-filter: none; background: var(--surface); }
  }
  @media (prefers-contrast: more) {
    :root { --hair: rgba(127,127,127,.45); --hair-strong: rgba(127,127,127,.7); }
  }
</style>
</head>

  <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></symbol>

  <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8"/></symbol>

<div class="app">

        <a href="/setup#cv/review"><svg class="i"><use href="#i-user"/></svg>My CV<span id="cv-name"></span></a>
      </div>
      <button class="fetch" id="fetch"><svg class="i"><use href="#i-refresh"/></svg><span>Find new jobs</span></button>

<div class="toast" id="toast" role="status"><span id="toast-msg"></span><button id="undo">Undo</button></div>

<script>
const STAGES = [
  ["new", "To review", "i-inbox"], ["saved", "Saved", "i-bookmark"], ["applied", "Applied", "i-send"],
  ["interview", "Interview", "i-calendar"], ["rejected", "Rejected", "i-xcircle"], ["hidden", "Hidden", "i-eyeoff"],
];
const STAGE_NAME = Object.fromEntries(STAGES.map(([k, l]) => [k, l]));
const SOURCE_NAMES = { linkedin: "LinkedIn", remotive: "Remotive", jobicy: "Jobicy", bdjobs: "BDjobs" };
let CATS = [];
let SRCS = [];
let me = { name: "", sources: [] };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (id) => `<svg class="i" aria-hidden="true"><use href="#${id}"/></svg>`;

let jobs = [];
let selected = null;
let lastUndo = null;
const prefs = { stage: "new", mode: "", night: false, restricted: false, cats: [], srcs: [], sort: "score" };
try { Object.assign(prefs, JSON.parse(localStorage.getItem("jh-prefs") || "{}")); } catch {}
const savePrefs = () => { try { localStorage.setItem("jh-prefs", JSON.stringify(prefs)); } catch {} };

/* ---------- helpers ---------- */
function ago(iso) {
  if (!iso) return "";
  const d = (Date.now() - new Date(iso)) / 864e5;
  if (isNaN(d)) return "";
  if (d < 1) return "Today";
  if (d < 2) return "Yesterday";
  if (d < 30) return `${Math.floor(d)} days ago`;
  return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
function daysLeft(iso) {
  if (!iso) return null;
  const d = Math.ceil((new Date(iso) - Date.now()) / 864e5);
  return isNaN(d) ? null : d;
}
const tier = (s) => (s >= 65 ? "t-hi" : s >= 45 ? "t-mid" : "t-lo");
function ring(score) {
  const c = 2 * Math.PI * 15;
  return `<div class="ring ${tier(score)}" role="img" aria-label="Match score ${score} of 100">
    <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="bg" cx="18" cy="18" r="15"/>
    <circle class="fg" cx="18" cy="18" r="15" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - score / 100)}"/></svg>
    <b aria-hidden="true">${score}</b></div>`;
}
function modeTag(j) {
  const remote = (j.work_mode || "Remote").startsWith("Remote");
  return `<span class="tag">${icon(remote ? "i-globe" : "i-building")}${esc((j.work_mode || "Remote").replace(" · ", ", "))}</span>`;
}
function tags(j, full = false) {
  const out = [modeTag(j)];
  if (j.night_shift) out.push(`<span class="tag night">${icon("i-moon")}Night shift</span>`);
  const left = daysLeft(j.deadline);
  if (left !== null && left >= 0 && left <= 5) out.push(`<span class="tag warn">${icon("i-clock")}${left === 0 ? "Closes today" : `Closes in ${left} day${left > 1 ? "s" : ""}`}</span>`);
  if (!j.eligible) out.push(`<span class="tag warn">Other region</span>`);
  if (full) j.categories.forEach((c) => out.push(`<span class="tag">${esc(c)}</span>`));
  return out.join("");
}
function place(j) {
  // Stored as "<work mode> · <place>"; drop the mode prefix, then de-duplicate ("Dhaka, Dhaka, Bangladesh").
  const raw = j.location.startsWith(j.work_mode) ? j.location.slice(j.work_mode.length) : j.location;
  const seen = new Set();
  return raw.split(/\s*[·,]\s*/).filter((p) => {
    const k = p.toLowerCase();
    if (!p || k.startsWith("remote") || k.startsWith("on-site") || k.startsWith("hybrid") || seen.has(k)) return false;
    seen.add(k);
    return true;
  }).join(", ");
}
const jobType = (t) => (t || "").replace(/FullTime/i, "Full time").replace(/PartTime/i, "Part time");

/* ---------- filtering ---------- */
function matchesFilters(j) {
  const q = $("q").value.trim().toLowerCase();
  return (prefs.restricted || j.eligible)
    && (!prefs.mode || (prefs.mode === "Remote" ? j.work_mode === "Remote" : j.work_mode !== "Remote"))
    && (!prefs.night || j.night_shift)
    && (!prefs.cats.length || j.categories.some((c) => prefs.cats.includes(c)))
    && (!prefs.srcs.length || prefs.srcs.includes(j.source))
    && (!q || `${j.title} ${j.company} ${j.notes} ${j.location}`.toLowerCase().includes(q));
}
function visibleList() {
  const sorters = {
    score: (a, b) => b.score - a.score || (b.posted || "").localeCompare(a.posted || ""),
    posted: (a, b) => (b.posted || "").localeCompare(a.posted || ""),
    deadline: (a, b) => (a.deadline || "9999").localeCompare(b.deadline || "9999"),
  };
  return jobs.filter((j) => j.status === prefs.stage && matchesFilters(j)).sort(sorters[prefs.sort]);
}

/* ---------- rendering ---------- */
function renderSide() {
  const base = jobs.filter(matchesFilters);
  $("stages").innerHTML = STAGES.map(([k, label, ic]) => `
    <button class="stage" data-stage="${k}" aria-current="${k === prefs.stage}">
      ${icon(ic)}<span>${label}</span><span class="count">${base.filter((j) => j.status === k).length || ""}</span>
    </button>`).join("");
  document.querySelectorAll("#mode button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === prefs.mode));
  $("night").setAttribute("aria-checked", prefs.night);
  $("restricted").setAttribute("aria-checked", prefs.restricted);
  $("cats").innerHTML = CATS.map((c) => `<button class="chip-btn" data-cat="${esc(c)}" aria-pressed="${prefs.cats.includes(c)}">${esc(c)}</button>`).join("");
  $("srcs").innerHTML = SRCS.map((s) => `<button class="chip-btn" data-src="${s}" aria-pressed="${prefs.srcs.includes(s)}">${s}</button>`).join("");
  $("sort").value = prefs.sort;
}

function renderList() {
  const list = visibleList();
  $("list-title").innerHTML = `${STAGE_NAME[prefs.stage]}<small>${list.length} job${list.length === 1 ? "" : "s"}</small>`;
  if (selected && !list.some((j) => j.id === selected)) selected = null;
  if (!selected && list.length && matchMedia("(min-width: 1181px)").matches) selected = list[0].id;
  const fresh = Date.now() - 864e5;
  $("list").innerHTML = list.length ? list.map((j) => `
    <li${j.id === selected ? " data-sel" : ""}>
      <button class="row" data-id="${esc(j.id)}" aria-current="${j.id === selected}">
        ${ring(j.score)}
        <div style="min-width:0">
          <div class="row-title">${esc(j.title)}</div>
          <div class="row-sub"><span class="co">${esc(j.company)}</span>${place(j) ? `<span>, ${esc(place(j))}</span>` : ""}</div>
          <div class="row-tags">${tags(j)}</div>
        </div>
        <div class="row-side">
          ${new Date(j.first_seen) > fresh && j.status === "new" ? `<span class="fresh" title="Found in the last day"></span>` : ""}
          <span class="when">${esc(ago(j.posted))}</span>
          <span>${esc(j.source)}</span>
        </div>
      </button>
    </li>`).join("") : emptyState();
}

function emptyState() {
  const filtered = jobs.some((j) => j.status === prefs.stage);
  if (prefs.stage === "new" && !filtered) return `<div class="empty">${icon("i-inbox").replace('class="i"', 'class="i big"')}
    <h3>${jobs.length ? "You're all caught up" : "No jobs yet"}</h3><p>Find new jobs to search ${esc(SRCS.join(", ") || "the job sites")} for roles that match your CV.</p>
    <button class="btn primary" data-act="fetch">${icon("i-refresh")}Find new jobs</button></div>`;
  if (filtered) return `<div class="empty">${icon("i-search").replace('class="i"', 'class="i big"')}
    <h3>No jobs match these filters</h3><p>Try clearing the search or turning off a filter in the sidebar.</p>
    <button class="btn quiet" data-act="clear">Clear filters</button></div>`;
  return `<div class="empty"><h3>Nothing in ${STAGE_NAME[prefs.stage]} yet</h3><p>Jobs you move here will show up in this list.</p></div>`;
}

let descReq = 0;
function renderDetail() {
  const j = jobs.find((x) => x.id === selected);
  if (!j) {
    $("detail").innerHTML = `<div class="placeholder">Select a job to see its details.</div>`;
    document.body.classList.remove("detail-open");
    return;
  }
  const left = daysLeft(j.deadline);
  const facts = [
    ["Where", j.work_mode === "Remote" ? "Remote" : j.work_mode.replace(" · ", ", ")],
    ["Location", place(j)],
    ["Posted", ago(j.posted)],
    ["Deadline", j.deadline ? `${new Date(j.deadline).toLocaleDateString(undefined, { day: "numeric", month: "short" })}${left !== null && left >= 0 ? ` (${left} day${left === 1 ? "" : "s"} left)` : ""}` : ""],
    ["Experience", (j.experience || "").split(/\s{2,}| The applicants/)[0]],
    ["Salary", j.salary],
    ["Job type", jobType(j.job_type)],
    ["Source", j.source],
  ].filter(([, v]) => v);
  const skills = j.skills || [];
  const why = [j.categories.length ? `Matches ${j.categories.join(", ")}` : "Matches your keywords",
               skills.length ? `${skills.length} of your skills: ${skills.slice(0, 5).join(", ")}${skills.length > 5 ? "…" : ""}` : ""].filter(Boolean).join(". ");
  $("detail").innerHTML = `<div class="detail-inner">
    <div class="detail-top">
      <button class="back" data-act="back">${icon("i-chevron")}Jobs</button>
      ${ring(j.score)}
      <div class="score-cap"><strong>${j.score >= 65 ? "Strong match" : j.score >= 45 ? "Good match" : "Partial match"}</strong>${esc(why)}</div>
    </div>
    <h2>${esc(j.title)}</h2>
    <p class="company">${esc(j.company)}</p>
    <div class="row-tags">${tags(j, true)}</div>
    <div class="actions">
      <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="open">${icon("i-external")}Open job post</a>
      <button class="btn quiet" data-set="saved" aria-pressed="${j.status === "saved"}" title="Save (S)">${icon("i-bookmark")}<span class="sr">Save</span></button>
      <button class="btn quiet" data-set="applied" aria-pressed="${j.status === "applied"}" title="Mark applied (A)">${icon("i-check")}Applied</button>
    </div>
    <h3 id="lbl-status">Status</h3>
    <div class="status-seg" role="group" aria-labelledby="lbl-status">
      ${STAGES.map(([k, l]) => `<button data-set="${k}" aria-pressed="${k === j.status}">${l}</button>`).join("")}
    </div>
    <dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    <h3>CV to send</h3>
    <div class="resume-row">
      <a class="resume" href="/cv.pdf" target="_blank" rel="noopener">${icon("i-file")}<div>${esc(cvName())}.pdf<small>ATS-friendly, built from your setup</small></div><span>Open</span></a>
      <a class="btn quiet" href="/cv.docx" download title="Download Word version">${icon("i-download")}Word</a>
    </div>
    <h3><label for="notes">Notes</label></h3>
    <textarea class="notes" id="notes" placeholder="Contact person, salary discussed, follow-up date">${esc(j.notes)}</textarea>
    <h3>Description</h3>
    <div class="desc clamp" id="desc">Loading description</div>
    <button class="link-btn" id="more" hidden>Show full description</button>
    <div class="keys"><kbd>J</kbd><kbd>K</kbd>next / previous&emsp;<kbd>O</kbd>open post&emsp;<kbd>S</kbd>save&emsp;<kbd>A</kbd>applied&emsp;<kbd>H</kbd>hide&emsp;<kbd>U</kbd>undo</div>
  </div>`;
  $("detail").scrollTop = 0;
  const req = ++descReq;
  fetch(`/api/job?id=${encodeURIComponent(j.id)}`).then((r) => r.json()).then(({ description }) => {
    if (req !== descReq) return;
    const d = $("desc");
    d.textContent = (description || "").trim() || "No description was captured for this job. Open the job post to read it.";
    if (d.scrollHeight > d.clientHeight + 8) $("more").hidden = false;
    else d.classList.remove("clamp");
  }).catch(() => { if (req === descReq) $("desc").textContent = "Couldn't load the description. Open the job post to read it."; });
}

function render() { renderSide(); renderList(); renderDetail(); }

/* ---------- actions ---------- */
async function update(id, fields) {
  const r = await fetch("/api/update", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, ...fields }) });
  if (!r.ok) { toast("Couldn't save that change. Is the dashboard still running?"); return false; }
  Object.assign(jobs.find((j) => j.id === id), fields);
  return true;
}

async function setStatus(id, status) {
  const j = jobs.find((x) => x.id === id);
  if (!j || j.status === status) return;
  const prev = j.status;
  const list = visibleList();
  const idx = list.findIndex((x) => x.id === id);
  if (!(await update(id, { status }))) return;
  if (status !== prefs.stage) {  // job leaves this list: select the next one so triage keeps flowing
    const next = list[idx + 1] || list[idx - 1];
    selected = next ? next.id : null;
    if (!selected) document.body.classList.remove("detail-open");
  }
  lastUndo = { id, prev };
  toast(`Moved to ${STAGE_NAME[status]}`, true);
  render();
}

let toastTimer;
function toast(msg, undo = false) {
  $("toast-msg").textContent = msg;
  $("undo").hidden = !undo;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 5000);
}
async function undo() {
  if (!lastUndo) return;
  const { id, prev } = lastUndo;
  lastUndo = null;
  await update(id, { status: prev });
  selected = id;
  $("toast").classList.remove("show");
  render();
}

function select(id, open = true) {
  selected = id;
  renderList();
  renderDetail();
  if (open) document.body.classList.add("detail-open");
  document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest" });
}
function move(delta) {
  const list = visibleList();
  if (!list.length) return;
  const i = list.findIndex((j) => j.id === selected);
  const next = list[Math.max(0, Math.min(list.length - 1, i < 0 ? 0 : i + delta))];
  select(next.id, matchMedia("(min-width: 1181px)").matches);
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (!t) {
    if (e.target.id === "scrim") document.body.classList.remove("side-open");
    return;
  }
  if (t.dataset.stage) { prefs.stage = t.dataset.stage; selected = null; savePrefs(); document.body.classList.remove("side-open"); render(); }
  else if (t.dataset.mode !== undefined && t.closest("#mode")) { prefs.mode = t.dataset.mode; savePrefs(); render(); }
  else if (t.id === "night" || t.id === "restricted") { prefs[t.id] = !prefs[t.id]; savePrefs(); render(); }
  else if (t.dataset.cat) { toggleIn(prefs.cats, t.dataset.cat); savePrefs(); render(); }
  else if (t.dataset.src) { toggleIn(prefs.srcs, t.dataset.src); savePrefs(); render(); }
  else if (t.dataset.id) select(t.dataset.id);
  else if (t.dataset.set) setStatus(selected, t.dataset.set);
  else if (t.dataset.act === "back") document.body.classList.remove("detail-open");
  else if (t.dataset.act === "fetch" || t.id === "fetch") startFetch();
  else if (t.dataset.act === "clear") { Object.assign(prefs, { mode: "", night: false, cats: [], srcs: [] }); $("q").value = ""; savePrefs(); render(); }
  else if (t.id === "undo") undo();
  else if (t.id === "menu") document.body.classList.add("side-open");
  else if (t.id === "more") { $("desc").classList.remove("clamp"); t.hidden = true; }
});
const toggleIn = (arr, v) => { const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); };

$("q").addEventListener("input", () => { renderSide(); renderList(); });
$("sort").addEventListener("change", (e) => { prefs.sort = e.target.value; savePrefs(); renderList(); });
document.addEventListener("change", (e) => {
  if (e.target.id === "notes" && selected) update(selected, { notes: e.target.value }).then((ok) => ok && toast("Notes saved"));
});
$("list").addEventListener("scroll", (e) => $("list-pane").classList.toggle("scrolled", e.target.scrollTop > 4), { passive: true });

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === "Escape") {
    if (typing) document.activeElement.blur();
    document.body.classList.remove("side-open", "detail-open");
    return;
  }
  if (typing) return;
  const k = e.key.toLowerCase();
  if (k === "/") { e.preventDefault(); $("q").focus(); }
  else if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (k === "k" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (k === "u") undo();
  else if (!selected) return;
  else if (k === "o" || e.key === "Enter") { const j = jobs.find((x) => x.id === selected); if (j) window.open(j.url, "_blank", "noopener"); }
  else if (k === "s") setStatus(selected, "saved");
  else if (k === "a") setStatus(selected, "applied");
  else if (k === "h") setStatus(selected, "hidden");
});

/* ---------- fetching ---------- */
async function startFetch() {
  await fetch("/api/scrape", { method: "POST" });
  $("log-wrap").hidden = false;
  pollFetch();
}
async function pollFetch() {
  let s;
  try { s = await (await fetch("/api/scrape")).json(); } catch { $("fetch-status").textContent = "Dashboard isn't responding."; return; }
  const btn = $("fetch");
  btn.disabled = s.running;
  btn.querySelector("span").textContent = s.running ? "Searching" : "Find new jobs";
  $("log").textContent = s.log.join("\n");
  const last = [...s.log].reverse().find((l) => l.trim()) || "";
  if (s.running) $("fetch-status").textContent = last.trim();
  else if (s.finished) $("fetch-status").textContent = `${last.replace(/^Done\.\s*/, "")} Last fetched ${new Date(s.finished).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}.`;
  if (s.running) setTimeout(pollFetch, 1500);
  else if (s.log.length) load();
}

const cvName = () => `${(me.name || "My").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "") || "My"}_CV`;
async function load() {
  const [list, state] = await Promise.all([fetch("/api/jobs").then((r) => r.json()), fetch("/api/state").then((r) => r.json())]);
  jobs = list;
  const c = state.criteria || {};
  me = { name: state.profile?.personal?.name || "", sources: c.sources || [] };
  CATS = c.roles || [];
  SRCS = (c.sources || []).map((s) => SOURCE_NAMES[s]).filter(Boolean);
  for (const j of jobs) if (!SRCS.includes(j.source)) SRCS.push(j.source);
  prefs.cats = prefs.cats.filter((x) => CATS.includes(x));
  prefs.srcs = prefs.srcs.filter((x) => SRCS.includes(x));
  $("brand-sub").textContent = SRCS.length ? `Searching ${SRCS.join(", ")}` : "Jobs matched to your CV";
  $("crit-sum").textContent = CATS.length ? `${CATS.length} role${CATS.length > 1 ? "s" : ""}` : "";
  $("cv-name").textContent = me.name.split(" ")[0] || "";
  render();
}
load();
pollFetch();
</script>
</body>
</html>
