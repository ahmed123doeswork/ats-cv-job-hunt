<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Hunt Setup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Ccircle cx='18' cy='18' r='14' fill='none' stroke='%23e3e6ea' stroke-width='5'/%3E%3Ccircle cx='18' cy='18' r='14' fill='none' stroke='%230B6E99' stroke-width='5' stroke-linecap='round' stroke-dasharray='88' stroke-dashoffset='22' transform='rotate(-90 18 18)'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #F3F4F6; --surface: #FFFFFF; --raised: #FFFFFF;
    --ink: #15171C; --ink-2: #464C5A; --ink-3: #6B7180;
    --hair: rgba(21, 23, 28, .09); --hair-strong: rgba(21, 23, 28, .18);
    --accent: #0B6E99; --accent-ink: #FFFFFF; --accent-wash: rgba(11, 110, 153, .10); --accent-line: rgba(11, 110, 153, .45);
    --good: #1E8A57; --good-wash: rgba(30, 138, 87, .12);
    --warn: #B4541A; --warn-wash: rgba(180, 84, 26, .11);
    --bad: #C23A2B;
    --low: #A3A8B3;
    --bar: rgba(243, 244, 246, .78);
    --sheet-shadow: 0 24px 64px rgba(15, 20, 30, .16), 0 2px 8px rgba(15, 20, 30, .07);
    --card-shadow: 0 1px 2px rgba(15, 20, 30, .06), 0 0 0 1px var(--hair);
    --row-hover: rgba(21, 23, 28, .04);
    --radius-s: 6px; --radius-m: 10px; --radius-l: 16px;
    --spring: cubic-bezier(.32, .72, 0, 1);
    --display: "Segoe UI Variable Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #15181D; --surface: #1B1F25; --raised: #22272E;
      --ink: #ECEEF2; --ink-2: #B8BDC8; --ink-3: #8D93A2;
      --hair: rgba(255, 255, 255, .08); --hair-strong: rgba(255, 255, 255, .17);
      --accent: #56B6E0; --accent-ink: #062330; --accent-wash: rgba(86, 182, 224, .14); --accent-line: rgba(86, 182, 224, .5);
      --good: #4CC38A; --good-wash: rgba(76, 195, 138, .14);
      --warn: #F0A060; --warn-wash: rgba(240, 160, 96, .13);
      --bad: #FF7A6B;
      --low: #5E6472;
      --bar: rgba(21, 24, 29, .78);
      --sheet-shadow: 0 24px 64px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
      --card-shadow: 0 0 0 1px var(--hair);
      --row-hover: rgba(255, 255, 255, .04);
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: 5rem; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh;
    font: 100%/1.5 "Segoe UI Variable Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { cursor: not-allowed; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-s); }
  svg.i { width: 1.05rem; height: 1.05rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
          stroke-linecap: round; stroke-linejoin: round; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Top bar: translucent floating layer ---------- */
  .bar {
    position: sticky; top: 0; z-index: 20; height: 3.75rem; display: flex; align-items: center; gap: 1rem;
    padding: 0 1.25rem; background: var(--bar); backdrop-filter: blur(20px) saturate(170%);
    border-bottom: 1px solid var(--hair);
  }
  .logo { display: flex; align-items: center; gap: .55rem; font: 650 1.05rem/1 var(--display); letter-spacing: -.01em; text-decoration: none; color: var(--ink); }
  .logo svg { width: 1.6rem; height: 1.6rem; }
  .phases { display: flex; align-items: center; gap: .35rem; margin: 0 auto; list-style: none; padding: 0; }
  .phases li { display: flex; align-items: center; gap: .35rem; }
  .phases li + li::before { content: ""; width: 2rem; height: 1px; background: var(--hair-strong); }
  .phase { display: flex; align-items: center; gap: .5rem; padding: .35rem .7rem .35rem .4rem; border-radius: 99px; font-size: .86rem; color: var(--ink-3); white-space: nowrap; }
  h1[tabindex="-1"]:focus { outline: none; }
  .phase .n { width: 1.5rem; height: 1.5rem; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 650; background: var(--hair); color: var(--ink-2); }
  .phase[aria-current="step"] { color: var(--ink); font-weight: 600; background: var(--surface); box-shadow: var(--card-shadow); }
  .phase[aria-current="step"] .n { background: var(--accent); color: var(--accent-ink); }
  .phase.done .n { background: var(--good); color: #fff; }
  .phase.done .n svg { width: .8rem; height: .8rem; stroke-width: 3; }
  .bar-right { display: flex; align-items: center; gap: .75rem; }
  .save-state { display: flex; align-items: center; gap: .35rem; font-size: .8rem; color: var(--ink-3); white-space: nowrap; }
  .save-state svg { width: .9rem; height: .9rem; }
  .save-state.err { color: var(--bad); }
  .save-state.dirty { color: var(--warn); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .6rem 1.05rem; border-radius: var(--radius-m);
    font-weight: 600; font-size: .92rem; min-height: 2.75rem; text-decoration: none; white-space: nowrap;
    transition: transform 100ms ease-out, background-color 120ms ease, filter 120ms ease, box-shadow 120ms ease;
  }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
  .btn.primary:disabled { filter: saturate(.5) opacity(.7); }
  .btn.quiet { background: var(--surface); color: var(--ink); box-shadow: var(--card-shadow); }
  .btn.quiet:hover { background: var(--raised); box-shadow: 0 0 0 1px var(--hair-strong); }
  .btn.ghost { color: var(--ink-2); }
  .btn.ghost:hover { background: var(--row-hover); color: var(--ink); }
  .btn.big { min-height: 3.25rem; padding: .8rem 1.5rem; font-size: 1rem; border-radius: 12px; }
  .btn .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icon-btn { width: 2.25rem; height: 2.25rem; border-radius: var(--radius-s); display: inline-grid; place-items: center; color: var(--ink-3); transition: background-color 120ms ease, color 120ms ease; }
  .icon-btn:hover { background: var(--row-hover); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--bad); }
  .icon-btn:disabled { opacity: .35; pointer-events: none; }
  .link { color: var(--accent); font-weight: 600; font-size: .88rem; display: inline-flex; align-items: center; gap: .3rem; }
  .link:hover { text-decoration: underline; }

  /* ---------- Welcome ---------- */
  .welcome { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 3rem; align-items: center;
             max-width: 72rem; margin: 0 auto; padding: 4.5rem 2rem 4rem; min-height: calc(100vh - 3.75rem); }
  .welcome h1 { font: 700 clamp(2.3rem, 4.6vw, 3.6rem)/1.04 var(--display); letter-spacing: -.035em; margin: 0 0 1.1rem; text-wrap: balance; }
  .welcome .lead { font-size: 1.12rem; color: var(--ink-2); max-width: 34rem; margin: 0 0 2rem; text-wrap: pretty; }
  .howto { list-style: none; padding: 0; margin: 0 0 2.25rem; display: grid; gap: .9rem; max-width: 30rem; }
  .howto li { display: grid; grid-template-columns: 2.75rem 1fr; gap: .9rem; align-items: center; }
  .howto b { display: block; font-weight: 600; }
  .howto span { font-size: .88rem; color: var(--ink-3); }
  .tile { width: 2.75rem; height: 2.75rem; border-radius: 12px; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent); position: relative; }
  .tile svg.i { width: 1.3rem; height: 1.3rem; }
  .howto .tile em { position: absolute; top: -.35rem; right: -.35rem; width: 1.15rem; height: 1.15rem; border-radius: 50%; background: var(--surface);
                    box-shadow: var(--card-shadow); font: 650 .68rem/1.15rem system-ui; font-style: normal; text-align: center; color: var(--ink-2); }
  .cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
  .privacy { display: flex; gap: .55rem; align-items: flex-start; margin-top: 1.6rem; font-size: .84rem; color: var(--ink-3); max-width: 30rem; }
  .privacy svg { margin-top: .15rem; color: var(--good); }

  /* Hero art: a CV page and the matches it produces */
  .art { position: relative; height: 30rem; }
  .art-paper {
    position: absolute; left: 6%; top: 1rem; width: 62%; aspect-ratio: 1 / 1.414; background: #fff; border-radius: 6px;
    box-shadow: var(--sheet-shadow); padding: 9% 9%; transform: rotate(-4deg);
  }
  .art-paper i { display: block; height: .5rem; border-radius: 3px; background: #E3E6EB; margin-bottom: .55rem; }
  .art-paper i.nm { height: 1.05rem; width: 58%; background: #1D2129; margin-bottom: .6rem; }
  .art-paper i.hd { height: .55rem; width: 30%; background: #0B6E99; margin-top: 1.15rem; }
  .art-paper i.w9 { width: 92%; } .art-paper i.w7 { width: 72%; } .art-paper i.w5 { width: 52%; } .art-paper i.w4 { width: 40%; }
  .art-cards { position: absolute; right: 0; top: 4.5rem; width: 64%; display: grid; gap: .7rem; }
  .art-card {
    display: grid; grid-template-columns: 2.6rem 1fr; gap: .8rem; align-items: center; padding: .85rem 1rem; border-radius: 14px;
    background: var(--surface); box-shadow: var(--sheet-shadow);
    animation: card-in 700ms var(--spring) both; animation-delay: calc(var(--d) * 120ms + 250ms);
  }
  .art-card:nth-child(2) { margin-left: 1.5rem; } .art-card:nth-child(3) { margin-left: .5rem; }
  .art-card b { display: block; font-size: .92rem; }
  .art-card span { font-size: .8rem; color: var(--ink-3); }
  @keyframes card-in { from { opacity: 0; transform: translateX(2.5rem) scale(.96); } }

  /* ---------- Builder shell ---------- */
  .shell { display: grid; grid-template-columns: 14.5rem minmax(0, 1fr) minmax(22rem, 32rem); min-height: calc(100vh - 3.75rem); }
  .shell.no-aside { grid-template-columns: 14.5rem minmax(0, 1fr); }

  .rail { padding: 1.5rem .75rem; border-right: 1px solid var(--hair); }
  .rail-inner { position: sticky; top: 5.25rem; }
  .rail h2 { font-size: .78rem; font-weight: 600; color: var(--ink-3); margin: 0 .6rem .6rem; letter-spacing: .01em; }
  .rail ol { list-style: none; padding: 0; margin: 0; display: grid; gap: .1rem; }
  .rail a {
    display: flex; align-items: center; gap: .65rem; padding: .5rem .6rem; border-radius: var(--radius-m); text-decoration: none;
    color: var(--ink-2); font-size: .9rem; transition: background-color 120ms ease, transform 100ms ease-out;
  }
  .rail a:hover { background: var(--row-hover); }
  .rail a:active { transform: scale(.98); }
  .rail a[aria-current="step"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--card-shadow); }
  .rail a[aria-current="step"] .st { color: var(--accent); }
  .rail .st { width: 1.75rem; height: 1.75rem; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
  .rail .ok { margin-left: auto; color: var(--good); }
  .rail .ok svg { width: .95rem; height: .95rem; stroke-width: 2.4; }
  .rail .opt { margin-left: auto; font-size: .72rem; color: var(--ink-3); }
  .rail-progress { margin: 1.25rem .6rem 0; font-size: .78rem; color: var(--ink-3); }
  .meter { height: 4px; border-radius: 99px; background: var(--hair); margin-top: .4rem; overflow: hidden; }
  .meter b { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width 500ms var(--spring); }

  .main { min-width: 0; padding: 2.25rem clamp(1.25rem, 3.5vw, 3rem) 0; display: flex; flex-direction: column; }
  .step { max-width: 40rem; width: 100%; flex: 1; }
  .step.enter { animation: step-in 440ms var(--spring) both; }
  .step.enter.back { animation-name: step-in-back; }
  @keyframes step-in { from { opacity: 0; transform: translateX(1.75rem); } }
  @keyframes step-in-back { from { opacity: 0; transform: translateX(-1.75rem); } }
  .step-head { display: grid; grid-template-columns: 3.25rem 1fr; gap: 1rem; align-items: start; margin-bottom: 1.75rem; }
  .step-head .tile { width: 3.25rem; height: 3.25rem; border-radius: 14px; }
  .step-head .tile svg.i { width: 1.5rem; height: 1.5rem; }
  .step-head .count { font-size: .8rem; color: var(--ink-3); font-weight: 500; }
  .step-head h1 { font: 680 1.85rem/1.12 var(--display); letter-spacing: -.025em; margin: .05rem 0 .4rem; text-wrap: balance; }
  .step-head p { margin: 0; color: var(--ink-2); max-width: 36rem; text-wrap: pretty; }

  .foot {
    position: sticky; bottom: 0; z-index: 5; max-width: 40rem; display: flex; align-items: center; gap: .75rem;
    padding: 1rem 0 1.25rem; margin-top: 2rem; background: linear-gradient(transparent, var(--paper) 30%);
  }
  .foot .spacer { flex: 1; }
  .foot .skip-note { font-size: .82rem; color: var(--ink-3); }

  /* ---------- Fields ---------- */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 1rem; }
  .span2 { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
  .field label, .label { font-size: .86rem; font-weight: 600; color: var(--ink); }
  .req { color: var(--accent); }
  .opt-tag { font-weight: 400; color: var(--ink-3); }
  .input, .field input, .field select, .field textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--hair-strong); border-radius: var(--radius-m);
    padding: .62rem .8rem; font-size: .95rem; min-height: 2.75rem; transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .field textarea { resize: vertical; line-height: 1.55; min-height: 7rem; }
  .field input:focus, .field select:focus, .field textarea:focus, .input:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash);
  }
  .field input:disabled { opacity: .5; }
  .field [aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 14%, transparent); }
  .hint { margin: 0; font-size: .8rem; color: var(--ink-3); }
  .err { margin: 0; font-size: .8rem; color: var(--bad); display: flex; gap: .3rem; align-items: center; }
  .err svg { width: .9rem; height: .9rem; }
  .check-row { display: flex; align-items: center; gap: .55rem; font-size: .9rem; color: var(--ink-2); min-height: 2.75rem; cursor: pointer; }
  .check-row input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
  .section-label { display: flex; align-items: center; gap: .5rem; font: 650 1.02rem/1.3 var(--display); margin: 2rem 0 .3rem; }
  .section-label svg { color: var(--accent); }
  .section-label + .hint { margin-bottom: .8rem; }
  .counter { font-size: .8rem; color: var(--ink-3); display: flex; justify-content: space-between; gap: 1rem; }
  .counter .good { color: var(--good); font-weight: 600; }
  .counter .warn { color: var(--warn); font-weight: 600; }

  /* Repeatable entries */
  .items { display: grid; gap: .9rem; }
  details.item { background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--card-shadow); }
  details.item > summary {
    list-style: none; display: flex; align-items: center; gap: .75rem; padding: .8rem .8rem .8rem 1rem; cursor: pointer; border-radius: var(--radius-l);
  }
  details.item > summary::-webkit-details-marker { display: none; }
  details.item > summary:hover { background: var(--row-hover); }
  .item-title { min-width: 0; flex: 1; }
  .item-title b { display: block; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-title span { font-size: .8rem; color: var(--ink-3); }
  .chev { transition: transform 250ms var(--spring); color: var(--ink-3); }
  details[open] > summary .chev { transform: rotate(180deg); }
  .item-body { padding: .4rem 1rem 1.1rem; }
  .item-tools { display: flex; gap: .1rem; }
  .add-btn {
    display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; min-height: 3rem; border-radius: var(--radius-l);
    border: 1.5px dashed var(--hair-strong); color: var(--accent); font-weight: 600; font-size: .92rem;
    transition: background-color 120ms ease, border-color 120ms ease, transform 100ms ease-out;
  }
  .add-btn:hover { background: var(--accent-wash); border-color: var(--accent-line); }
  .add-btn:active { transform: scale(.99); }
  .row-list { display: grid; gap: .6rem; margin-bottom: .7rem; }
  .mini-row { display: grid; gap: .6rem; align-items: end; background: var(--surface); padding: .75rem; border-radius: var(--radius-m); box-shadow: var(--card-shadow); }
  .mini-row.c3 { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 9.5rem auto; }
  .mini-row.c2 { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; }
  .mini-row .field label { font-size: .78rem; font-weight: 500; color: var(--ink-3); }

  .empty-card { text-align: center; padding: 2.25rem 1.5rem; background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--card-shadow); margin-bottom: .9rem; }
  .empty-card .tile { margin: 0 auto .8rem; }
  .empty-card h3 { margin: 0 0 .3rem; font-size: 1.02rem; }
  .empty-card p { margin: 0 auto 1.1rem; max-width: 26rem; color: var(--ink-2); font-size: .9rem; }

  .lint { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .1rem; }
  .pill { display: inline-flex; align-items: center; gap: .3rem; font-size: .76rem; font-weight: 500; padding: .14rem .55rem; border-radius: 99px; background: var(--paper); color: var(--ink-2); }
  .pill svg.i { width: .8rem; height: .8rem; }
  .pill.good { background: var(--good-wash); color: var(--good); }
  .pill.warn { background: var(--warn-wash); color: var(--warn); }

  .tips { list-style: none; padding: 1rem 1.1rem; margin: 1.25rem 0 0; background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--card-shadow); display: grid; gap: .55rem; }
  .tips li { display: flex; gap: .6rem; font-size: .88rem; color: var(--ink-2); }
  .tips li svg { color: var(--accent); margin-top: .15rem; }
  .tips h3 { margin: 0 0 .1rem; font-size: .85rem; }

  /* Chips */
  .chipbox {
    display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; padding: .45rem; min-height: 3rem;
    background: var(--surface); border: 1px solid var(--hair-strong); border-radius: var(--radius-m); cursor: text;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .chipbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
  .chipbox[aria-invalid="true"] { border-color: var(--bad); }
  .chipbox input { flex: 1 1 10rem; min-width: 8rem; border: 0; outline: none; background: none; padding: .35rem .35rem; font-size: .93rem; }
  .chip { display: inline-flex; align-items: center; gap: .2rem; padding: .25rem .3rem .25rem .7rem; border-radius: 99px;
          background: var(--accent-wash); color: var(--ink); font-size: .86rem; font-weight: 500; animation: pop 260ms var(--spring); }
  .chip button { width: 1.5rem; height: 1.5rem; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); }
  .chip button:hover { background: var(--hair); color: var(--ink); }
  .chip button svg { width: .8rem; height: .8rem; }
  .chip.neg { background: var(--warn-wash); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .suggest { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .65rem; }
  .suggest-label { font-size: .78rem; color: var(--ink-3); margin: .9rem 0 0; }
  .sug {
    display: inline-flex; align-items: center; gap: .3rem; padding: .3rem .7rem .3rem .5rem; border-radius: 99px; font-size: .84rem; min-height: 2rem;
    border: 1px solid var(--hair-strong); color: var(--ink-2); background: var(--surface); transition: background-color 120ms ease, border-color 120ms ease, transform 100ms ease-out;
  }
  .sug svg { width: .85rem; height: .85rem; color: var(--accent); }
  .sug:hover { border-color: var(--accent-line); color: var(--ink); }
  .sug:active { transform: scale(.95); }

  .fields-tabs { display: flex; gap: .35rem; overflow-x: auto; padding: .15rem .1rem .5rem; margin-top: .5rem; scrollbar-width: thin; }
  .ftab { display: inline-flex; align-items: center; gap: .4rem; padding: .4rem .75rem; border-radius: 99px; font-size: .84rem; color: var(--ink-2); white-space: nowrap;
          background: var(--surface); box-shadow: var(--card-shadow); transition: background-color 120ms ease, color 120ms ease; min-height: 2.25rem; }
  .ftab svg { width: .95rem; height: .95rem; }
  .ftab[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }

  /* Choice cards */
  .choices { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); }
  .choice {
    position: relative; text-align: left; display: flex; flex-direction: column; gap: .55rem; padding: 1rem 1rem 1.05rem; border-radius: var(--radius-l);
    background: var(--surface); box-shadow: var(--card-shadow); transition: box-shadow 150ms ease, transform 100ms ease-out, background-color 150ms ease;
  }
  .choice:hover { box-shadow: 0 0 0 1px var(--hair-strong), 0 4px 14px rgba(15, 20, 30, .06); }
  .choice:active { transform: scale(.98); }

  .choice b { font-size: .97rem; }
  .choice span { font-size: .82rem; color: var(--ink-3); line-height: 1.4; }
  .choice .tick { position: absolute; top: .8rem; right: .8rem; width: 1.35rem; height: 1.35rem; border-radius: 50%; border: 1.5px solid var(--hair-strong); display: grid; place-items: center; color: transparent; transition: all 200ms var(--spring); }
  .choice .tick svg { width: .8rem; height: .8rem; stroke-width: 3; }
  .choice[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); background: color-mix(in srgb, var(--accent) 4%, var(--surface)); }
  .choice[aria-pressed="true"] .tile { background: var(--accent); color: var(--accent-ink); }
  .choice[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); transform: scale(1.05); }
  .choice:disabled { opacity: .5; }

  .toggles { display: flex; flex-wrap: wrap; gap: .45rem; }
  .tog { display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .9rem; border-radius: 99px; font-size: .88rem; min-height: 2.5rem;
         background: var(--surface); box-shadow: var(--card-shadow); color: var(--ink-2); transition: background-color 120ms ease, color 120ms ease, transform 100ms ease-out; }
  .tog:active { transform: scale(.96); }
  .tog svg { width: .95rem; height: .95rem; }
  .tog[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; font-weight: 600; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--hair); border-radius: 10px; padding: 3px; max-width: 30rem; }
  .seg button { padding: .5rem .6rem; border-radius: 8px; font-size: .88rem; color: var(--ink-2); min-height: 2.5rem; transition: background-color 150ms ease, color 150ms ease; }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  .seg-desc { font-size: .82rem; color: var(--ink-3); margin: .5rem 0 0; }

  /* ---------- Review lists ---------- */
  .ats-hero { display: grid; grid-template-columns: auto 1fr; gap: 1.25rem; align-items: center; padding: 1.25rem; background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--card-shadow); }
  .ats-hero h2 { margin: 0 0 .2rem; font: 650 1.2rem/1.25 var(--display); letter-spacing: -.01em; }
  .ats-hero p { margin: 0; color: var(--ink-2); font-size: .9rem; }
  .checks { list-style: none; margin: 1rem 0 0; padding: 0; background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--card-shadow); }
  .checks li { display: grid; grid-template-columns: 1.4rem 1fr auto; gap: .75rem; align-items: center; padding: .75rem 1rem; }
  .checks li + li { border-top: 1px solid var(--hair); }
  .checks li > svg { width: 1.2rem; height: 1.2rem; }
  .checks .y { color: var(--good); } .checks .n { color: var(--warn); }
  .checks b { font-size: .9rem; font-weight: 600; display: block; }
  .checks span { font-size: .8rem; color: var(--ink-3); }
  .downloads { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.25rem; }

  .summary-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--card-shadow); }
  .summary-list li { display: grid; grid-template-columns: 2.5rem 1fr auto; gap: .9rem; align-items: center; padding: .85rem 1rem; }
  .summary-list li + li { border-top: 1px solid var(--hair); }
  .summary-list .tile { width: 2.5rem; height: 2.5rem; border-radius: 11px; }
  .summary-list .k { font-size: .78rem; color: var(--ink-3); }
  .summary-list .v { font-size: .92rem; font-weight: 500; overflow-wrap: anywhere; }
  .summary-list .v.muted { color: var(--ink-3); font-weight: 400; }

  .sources { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  .source { display: grid; grid-template-columns: 2.4rem 1fr auto; gap: .75rem; align-items: center; text-align: left; padding: .85rem .9rem; border-radius: var(--radius-l); background: var(--surface); box-shadow: var(--card-shadow); }
  .source .tile { width: 2.4rem; height: 2.4rem; border-radius: 10px; font: 700 .95rem/1 var(--display); }
  .source b { font-size: .92rem; display: block; }
  .source span { font-size: .78rem; color: var(--ink-3); }
  .source:disabled { opacity: .55; }
  .track { width: 2.25rem; height: 1.35rem; border-radius: 99px; background: var(--hair-strong); position: relative; transition: background-color 180ms ease; flex: none; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(1.35rem - 4px); height: calc(1.35rem - 4px); border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform 240ms var(--spring); }
  [aria-checked="true"] > .track { background: var(--accent); }
  [aria-checked="true"] > .track::after { transform: translateX(.9rem); }

  .start-card { margin-top: 1.5rem; padding: 1.4rem; border-radius: var(--radius-l); background: var(--surface); box-shadow: var(--card-shadow); display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
  .start-card p { margin: 0; flex: 1 1 14rem; color: var(--ink-2); font-size: .9rem; }
  .start-card p b { display: block; color: var(--ink); font-size: 1rem; margin-bottom: .15rem; }

  /* ---------- Aside: CV preview / search card ---------- */
  .aside { border-left: 1px solid var(--hair); padding: 1.5rem 1.5rem 2rem; background: color-mix(in srgb, var(--paper) 55%, var(--hair)); }
  .aside-inner { position: sticky; top: 5.25rem; }

  .aside-head .t { flex: 1; min-width: 0; }
  .aside-head b { display: block; font-size: .92rem; }
  .aside-head span { font-size: .78rem; color: var(--ink-3); }
  .paper-wrap { position: relative; overflow: hidden; border-radius: 4px; box-shadow: var(--sheet-shadow); background: #fff; }

  .cv { width: 794px; min-height: 1123px; padding: 56px 64px; background: #fff; color: #1D2129; transform-origin: 0 0;
        font: 14px/1.38 Calibri, Carlito, "Segoe UI", Arial, sans-serif; }

  .cv .cv-title { font-size: 17px; margin-top: 4px; }
  .cv .cv-contact { margin-top: 6px; color: #333; }
  .cv section { position: relative; margin-top: 14px; border-radius: 4px; transition: background-color 300ms ease, box-shadow 300ms ease; }

  .cv .e { margin-bottom: 8px; }
  .cv .e-top { display: flex; justify-content: space-between; gap: 16px; }

  .cv ul { margin: 2px 0 0; padding-left: 18px; }
  .cv li { margin: 1px 0; }
  .cv p { margin: 0 0 3px; }
  .cv .ph { color: #B4B9C2; }

  .sc-row .none { color: var(--ink-3); font-size: .84rem; }

  .ring { position: relative; width: 2.6rem; height: 2.6rem; flex: none; }

  .peek { display: none; }

  .toast {

    padding: .65rem .7rem .65rem 1.1rem; border-radius: var(--radius-l); background: var(--ink); color: var(--paper);
    font-size: .88rem; box-shadow: var(--sheet-shadow); max-width: calc(100vw - 2rem);

    transition: transform 380ms var(--spring), opacity 200ms ease;

  .toast button { color: var(--paper); font-weight: 650; padding: .3rem .7rem; border-radius: var(--radius-s); background: rgba(127,127,127,.25); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1240px) {

  }
  @media (max-width: 1040px) {

    .aside {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 88vh; overflow-y: auto; border: 0;
      border-radius: 20px 20px 0 0; background: var(--paper); box-shadow: var(--sheet-shadow);
      transform: translateY(104%); visibility: hidden; transition: transform 460ms var(--spring), visibility 0s 460ms;
    }

    .aside-inner { position: static; max-width: 34rem; margin: 0 auto; }
    .paper-scroll { max-height: none; }
    .peek { display: inline-flex; }
    .welcome { grid-template-columns: 1fr; padding-top: 3rem; gap: 1rem; }
    .art { height: 22rem; max-width: 32rem; width: 100%; }
  }
  @media (max-width: 760px) {

    .rail-inner { position: static; }
    .rail h2, .rail ol { display: none; }
    .rail-progress { margin: 0; }
    .bar { gap: .5rem; padding: 0 .75rem; }
    .logo { font-size: 0; gap: 0; }
    .phases { margin: 0 auto 0 0; }
    .phases li + li::before { width: .6rem; }
    .phase .lbl { display: none; }
    .phase[aria-current="step"] .lbl { display: inline; }
    .save-state span { display: none; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .mini-row.c3, .mini-row.c2 { grid-template-columns: minmax(0, 1fr) auto; }
    .mini-row .field:nth-child(2), .mini-row .field:nth-child(3) { grid-column: 1; }
    .main { padding-top: 1.25rem; }
    .step-head { grid-template-columns: 1fr; }
    .step-head h1 { font-size: 1.55rem; }
    .welcome { padding: 2rem 1rem 3rem; }
    .art { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {

    .step.enter { animation: fade 200ms ease both !important; }

    .aside { transition: opacity 200ms ease !important; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .bar { backdrop-filter: none; background: var(--paper); }
  }
  @media (prefers-contrast: more) {
    :root { --hair: rgba(127,127,127,.45); --hair-strong: rgba(127,127,127,.75); }
  }

function field(k, label, o = {}) {
  const id = "f-" + k.replace(/\./g, "-");
  const v = getPath(k) ?? "";

    o.type ? `type="${o.type}"` : `type="text"`, o.ph ? `placeholder="${esc(o.ph)}"` : "", o.auto ? `autocomplete="${o.auto}"` : "",
    o.list ? `list="${o.list}"` : "", o.req ? `aria-required="true"` : "", o.disabled ? "disabled" : "",
    o.hint ? `aria-describedby="${id}-hint"` : "",
  ].join(" ");
  const control = o.textarea
    ? `<textarea id="${id}" data-k="${k}" ${o.lines ? "data-lines" : ""} rows="${o.rows || 4}" placeholder="${esc(o.ph || "")}" ${o.hint ? `aria-describedby="${id}-hint"` : ""}>${esc(o.lines ? (v || []).join("\n") : v)}</textarea>`
    : o.options
      ? `<select id="${id}" data-k="${k}">${o.options.map((x) => `<option ${x === v ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>`
      : `<input id="${id}" data-k="${k}" value="${esc(v)}" ${attrs}>`;

    <p class="err" id="${id}-err" hidden></p>

}

function chipInput(k, o = {}) {
  const arr = getPath(k) || [];
  const id = o.id || "c-" + k.replace(/\./g, "-");
  const have = new Set(arr.map(lc));
  const sugg = (o.suggestions || []).filter((s, i, a) => !have.has(lc(s)) && a.findIndex((x) => lc(x) === lc(s)) === i).slice(0, o.max || 14);
  return `<div class="chipbox" data-chips="${k}" id="${id}-box" ${o.label ? `role="group" aria-label="${esc(o.label)}"` : ""}>

      <input id="${id}" data-chip-input="${k}" placeholder="${esc(arr.length ? o.ph2 || "Add another" : o.ph || "Type and press Enter")}" autocomplete="off" ${o.label ? `aria-label="${esc(o.label)}"` : ""}>

    ${sugg.length ? `${o.suggestLabel ? `<p class="suggest-label">${o.suggestLabel}</p>` : ""}<div class="suggest">${sugg.map((s) =>

}

function itemTools(list, i, n) {
  return `<span class="item-tools">
    <button type="button" class="icon-btn" data-move="${list}" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="Move up">${icon("up")}</button>
    <button type="button" class="icon-btn" data-move="${list}" data-i="${i}" data-d="1" ${i === n - 1 ? "disabled" : ""} aria-label="Move down">${icon("down")}</button>
    <button type="button" class="icon-btn danger" data-del="${list}" data-i="${i}" aria-label="Delete">${icon("trash")}</button>
  </span>`;
}

function ring(score, cls = "") {
  const c = 2 * Math.PI * 15;
  const t = score >= 75 ? "t-hi" : score >= 50 ? "t-mid" : "t-lo";
  return `<div class="ring ${t} ${cls}" role="img" aria-label="Score ${score} out of 100">
    <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="bg" cx="18" cy="18" r="15"/>
    <circle class="fg" cx="18" cy="18" r="15" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - score / 100)}"/></svg>
    <b aria-hidden="true">${score}</b></div>`;
}

function bulletLint(bullets) {
  const b = (bullets || []).filter((x) => x.trim());
  if (!b.length) return "";
  const nums = b.filter((x) => /\d/.test(x)).length;
  const weak = b.filter((x) => !ACTION_VERBS.has(lc(x.replace(/^[•\-*\s]+/, "").split(/\s+/)[0]).replace(/[^a-z]/g, ""))).length;
  const long = b.filter((x) => words(x) > 35).length;
  return [
    `<span class="pill">${b.length} point${b.length > 1 ? "s" : ""}</span>`,
    nums ? `<span class="pill good">${icon("check")}${nums} with numbers</span>` : `<span class="pill warn">${icon("alert")}Add a number to show impact</span>`,
    weak ? `<span class="pill warn">${icon("alert")}${weak} not starting with an action verb</span>` : `<span class="pill good">${icon("check")}Strong verbs</span>`,
    long ? `<span class="pill warn">${icon("alert")}${long} too long (35+ words)</span>` : "",
  ].join("");
}

function vPersonal() {
  const me = P.personal, e = [];
  if (!me.name.trim()) e.push(["P.personal.name", "Enter your full name."]);
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(me.email.trim())) e.push(["P.personal.email", "Enter an email address like name@example.com."]);
  if ((me.phone.match(/\d/g) || []).length < 7) e.push(["P.personal.phone", "Enter a phone number with at least 7 digits."]);
  if (!me.location.trim()) e.push(["P.personal.location", "Enter your city and country."]);
  return e;
}

      <p><b>${editing() ? "Save your new search" : "Everything's ready"}</b>${err.length ? `${icon("alert")} ${esc(err[0][1])}` : `Takes about ${estimate()} minute${estimate() > 1 ? "s" : ""}. You can browse matches while it runs.`}</p>
      ${editing() ? `<button type="button" class="btn quiet big" id="save-only" ${err.length ? "disabled" : ""}>Save without searching</button>` : ""}
      <button type="button" class="btn primary big" id="start" ${err.length ? "disabled" : ""}>${icon("rocket")}${editing() ? "Save and search again" : "Start job search"}</button>

}

function searchRows() {
  const lv = C.levels.map((l) => LEVELS.find((x) => x.id === l)?.name).filter(Boolean).join(", ");
  const jt = C.job_types.map((t) => JOB_TYPES.find((x) => x[0] === t)?.[1]).join(", ");
  return [
    { icon: "trending", k: "Level", v: [lv, jt].filter(Boolean).join(" · "), go: "search/level" },
    { icon: "target", k: "Roles", v: C.roles.join(", "), go: "search/roles" },
    { icon: "tag", k: "Skills to look for", v: C.keywords.join(", "), go: "search/keywords" },
    { icon: "ban", k: "Words to avoid", v: C.exclude.join(", "), go: "search/keywords" },
    { icon: "pin", k: "Where", v: whereText(), go: "search/location" },
    { icon: "clock", k: "Posted within", v: (POSTED.find(([v]) => v === C.posted_within) || POSTED[1])[1], go: "search/location" },
  ];
}
function whereText() {
  const parts = [];
  const home = [C.city, C.country].filter(Boolean).join(", ");
  if (C.work_modes.includes("remote")) parts.push("Remote");
  const office = C.work_modes.filter((m) => m !== "remote").map((m) => MODES.find((x) => x.id === m).name);
  if (office.length) parts.push(`${office.join(" or ")}${home ? ` in ${home}` : ""}`);
  return parts.join(" · ");
}
function estimate() {
  const r = Math.min(C.roles.length, 10) || 1;
  const remote = C.work_modes.includes("remote"), office = C.work_modes.some((m) => m !== "remote");
  let s = 0;
  if (C.sources.includes("linkedin")) s += r * ((office ? 1 : 0) + (remote ? (C.country ? 2 : 1) : 0)) * 2 * 2.4 + r * 10 * 1.9;
  if (remote && C.sources.includes("remotive")) s += r * 2;
  if (remote && C.sources.includes("jobicy")) s += r * 2;
  if (lc(C.country) === "bangladesh" && C.sources.includes("bdjobs")) s += r * 12;
  return Math.max(1, Math.round(s / 60));
}

/* ======================================================================
   Derived data
   ====================================================================== */
function spanText(x) {
  const f = (v) => { const m = /^(\d{4})-(\d{2})/.exec(v || ""); return m ? `${["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][+m[2] - 1]} ${m[1]}` : (v || ""); };
  const end = x.current ? "Present" : f(x.end);
  return [f(x.start), end].filter(Boolean).join(" – ");
}
const allSkills = () => P.skills.flatMap((g) => g.items || []);
function totalYears() {
  let months = 0;
  const now = new Date();
  for (const e of P.experience) {
    const s = /^(\d{4})-(\d{2})/.exec(e.start || "");
    if (!s) continue;
    const en = e.current ? [now.getFullYear(), now.getMonth() + 1] : (/^(\d{4})-(\d{2})/.exec(e.end || "") || []).slice(1).map(Number);
    if (!en.length) continue;
    months += Math.max(0, (en[0] - +s[1]) * 12 + (en[1] - +s[2]));
  }
  return months / 12;
}
function cvRoles() {
  const out = [];
  const add = (t) => { t = (t || "").replace(/\b(senior|sr\.?|junior|jr\.?|lead|intern|trainee)\b/gi, "").replace(/\s+/g, " ").trim(); if (t && !out.some((x) => lc(x) === lc(t)) && !C.roles.some((x) => lc(x) === lc(t))) out.push(t); };
  add(P.personal.headline);
  P.experience.slice(0, 3).forEach((e) => add(e.title));
  return out;
}
function guessFields() {
  const text = lc([P.personal.headline, ...P.experience.map((e) => e.title), ...(C?.roles || []), ...allSkills()].join(" "));
  const scored = FIELDS.map((f) => [f.id, [...f.roles, ...f.skills].filter((x) => text.includes(lc(x))).length +
    f.roles.flatMap((r) => r.toLowerCase().split(/\W+/)).filter((w) => w.length > 3 && text.includes(w)).length * .2]);
  scored.sort((a, b) => b[1] - a[1]);
  return scored.map((s) => s[0]);
}
function autoRegions() {
  const c = lc(C.country);
  return c ? Object.keys(REGIONS).filter((r) => REGIONS[r].includes(c)) : [];
}

function atsCheck() {
  const me = P.personal;
  const bullets = [...P.experience, ...P.projects].flatMap((e) => (e.bullets || []).filter((b) => b.trim()));
  const verbOk = bullets.filter((b) => ACTION_VERBS.has(lc(b.replace(/^[•\-*\s]+/, "").split(/\s+/)[0]).replace(/[^a-z]/g, ""))).length;
  const nums = bullets.filter((b) => /\d/.test(b)).length;
  const sw = words(P.summary);
  const skills = allSkills().length;
  const hasWork = P.experience.some((e) => e.title) || P.projects.some((x) => x.name);
  const datesOk = P.experience.filter((e) => e.title).every((e) => e.start && (e.end || e.current));
  const checks = [
    { w: 15, ok: !vPersonal().length, label: "Contact details", tip: "Add your name, email, phone and location.", okText: "Name, email, phone and location are all there.", step: "cv/personal" },
    { w: 5, ok: !!me.linkedin.trim(), label: "LinkedIn profile", tip: "Recruiters usually check it. Add the link if you have one.", okText: "Linked.", step: "cv/personal" },
    { w: 5, ok: !!me.headline.trim(), label: "Professional title", tip: "Add the job title you're going for under your name.", okText: "Tells ATS what role you're targeting.", step: "cv/personal" },
    { w: 10, ok: sw >= 30 && sw <= 110, label: "Summary length", tip: sw ? `It's ${sw} words. Aim for 40–90.` : "Add a short summary of 40–90 words.", okText: `${sw} words.`, step: "cv/summary" },
    { w: 15, ok: hasWork, label: "Experience or projects", tip: "Add at least one job or project.", okText: "Shows what you've done.", step: P.experience.length ? "cv/experience" : "cv/projects" },
    { w: 5, ok: hasWork && datesOk, label: "Dates on every job", tip: "Add start and end dates (month and year) to each job.", okText: "Consistent month and year format.", step: "cv/experience" },
    { w: 10, ok: bullets.length > 0 && verbOk / bullets.length >= .7, label: "Action verbs", tip: bullets.length ? `${bullets.length - verbOk} of ${bullets.length} points don't start with a verb like Built, Led or Improved.` : "Describe what you did as bullet points starting with a verb.", okText: "Points start with strong verbs.", step: P.experience.length ? "cv/experience" : "cv/projects" },
    { w: 10, ok: bullets.length > 0 && nums / bullets.length >= .3, label: "Measurable results", tip: "Add numbers to at least a third of your points (%, users, money, time saved).", okText: `${nums} of ${bullets.length} points include numbers.`, step: P.experience.length ? "cv/experience" : "cv/projects" },
    { w: 15, ok: skills >= 8, label: "Skills", tip: `You have ${skills}. List at least 8 skills employers ask for.`, okText: `${skills} skills listed.`, step: "cv/skills" },
    { w: 10, ok: P.education.some((e) => e.degree || e.school), label: "Education", tip: "Add your highest qualification.", okText: "Included.", step: "cv/education" },
  ];
  const total = checks.reduce((a, c) => a + c.w, 0);
  const score = Math.round(checks.filter((c) => c.ok).reduce((a, c) => a + c.w, 0) / total * 100);
  checks.sort((a, b) => a.ok - b.ok);
  return { score, checks };
}

function draftSummary() {
  const title = P.personal.headline || P.experience[0]?.title || "Professional";
  const yrs = Math.round(totalYears());
  const skills = allSkills().slice(0, 4);
  const edu = P.education[0];
  const orgs = [...new Set(P.experience.map((e) => e.company).filter(Boolean))].slice(0, 2);
  let s = yrs >= 1 ? `${title} with ${yrs}+ year${yrs > 1 ? "s" : ""} of experience${orgs.length ? ` at ${orgs.join(" and ")}` : ""}.`
    : `${title}${edu?.degree ? ` with a ${edu.degree}${edu.school ? ` from ${edu.school}` : ""}` : ""}.`;
  if (skills.length) s += ` Skilled in ${skills.slice(0, -1).join(", ")}${skills.length > 1 ? " and " : ""}${skills[skills.length - 1]}.`;
  s += " [Add one sentence on what you do best and a result it delivered, e.g. \"Cut report time by 40%\".]";
  return s;
}

function renderPhases(step) {

function renderRail(step) {

function route() {
  let h = location.hash.slice(1);
  if (!h) h = defaultRoute();
  if (h !== "welcome" && stepIndex(h) < 0) h = defaultRoute();

  current = h;
  closeSheet();
  render(true);
}
function defaultRoute() {
  if (!P.complete) return P.personal.name ? "cv/personal" : "welcome";
  if (!C.complete) return "search/level";
  return "search/start";
}
function go(h) { if (location.hash.slice(1) === h) route(); else location.hash = h; }

function nextStep() {

  go(`${STEPS[idx + 1].phase}/${STEPS[idx + 1].id}`);
}
function prevStep() {
  const idx = stepIndex(current);
  go(idx <= 0 ? "welcome" : `${STEPS[idx - 1].phase}/${STEPS[idx - 1].id}`);
}

function showErrors(errs) {
  document.querySelectorAll(".err").forEach((e) => { e.hidden = true; e.textContent = ""; });
  document.querySelectorAll("[aria-invalid]").forEach((e) => e.removeAttribute("aria-invalid"));
  let first = null;
  for (const [k, msg] of errs) {
    const id = k.startsWith("P.") || k.startsWith("C.") ? "f-" + k.replace(/\./g, "-") : null;
    const errEl = id ? $(id + "-err") : $("err-" + k);
    const input = id ? $(id) : $("c-C-" + k + "-box") || document.querySelector(`[data-toggle="C.${k}"]`);
    if (errEl) { errEl.innerHTML = `${icon("alert")}${esc(msg)}`; errEl.hidden = false; }
    if (input && id) { input.setAttribute("aria-invalid", "true"); input.setAttribute("aria-errormessage", id + "-err"); }
    if (!first) first = id ? input : (input?.querySelector?.("input") || input);
  }
  first?.focus();
  first?.scrollIntoView({ block: "center", behavior: "smooth" });
}

/* ======================================================================
   Saving
   ====================================================================== */
const timers = {};
let dirtyCriteria = false;
function setSave(state) {
  const el = $("save-state");
  el.className = "save-state " + (state === "error" ? "err" : state === "dirty" ? "dirty" : "");
  el.innerHTML = state === "saving" ? `${icon("clock")}<span>Saving</span>`
    : state === "saved" ? `${icon("check")}<span>Saved</span>`
    : state === "dirty" ? `${icon("alert")}<span>Unsaved changes</span>`
    : state === "error" ? `${icon("cloud-off")}<span>Not saved. Is the Job Hunt window still open?</span>` : "";
}
function strip(o) { return JSON.parse(JSON.stringify(o, (k, v) => (k.startsWith("_") ? undefined : v))); }
async function saveNow(which, extra = {}) {
  clearTimeout(timers[which]);
  setSave("saving");
  try {
    const r = await fetch(which === "P" ? "/api/profile" : "/api/criteria", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...strip(which === "P" ? P : C), ...extra }) });
    if (!r.ok) throw new Error();
    if (which === "C") { dirtyCriteria = false; criteriaExisted = true; }
    setSave("saved");
    return await r.json();
  } catch { setSave("error"); return null; }
}
function changed(which) {
  if (which === "C" && C.complete) { dirtyCriteria = true; setSave("dirty"); return; }  // edits apply when you press Save
  setSave("saving");
  clearTimeout(timers[which]);
  timers[which] = setTimeout(() => saveNow(which), 500);
}

/* ======================================================================
   Prefill search from CV
   ====================================================================== */
function prefillCriteria() {
  C._prefilled = true;
  if (!C.roles.length) C.roles = cvRoles().slice(0, 4);
  if (!C.keywords.length) C.keywords = allSkills().slice(0, 12);
  const loc = (P.personal.location || "").split(",").map((s) => s.trim()).filter(Boolean);
  if (!C.country && loc.length) {
    const last = loc[loc.length - 1];
    const match = COUNTRIES.find((c) => lc(c) === lc(last));
    if (match || loc.length > 1) { C.country = match || last; if (loc.length > 1) C.city = loc[0]; }
  }
  const y = totalYears();
  C.levels = !P.experience.length ? ["internship", "entry"] : y < 1 ? ["internship", "entry"] : y < 2.5 ? ["entry", "mid"] : y < 5 ? ["mid"] : y < 8 ? ["mid", "senior"] : ["senior", "lead"];
  if (lc(C.country) === "bangladesh" && !C.sources.includes("bdjobs")) C.sources.push("bdjobs");
  changed("C");
}

/* ======================================================================
   Events
   ====================================================================== */
function newItem(list) {
  return {
    experience: { title: "", company: "", location: "", start: "", end: "", current: false, bullets: [] },
    education: { degree: "", school: "", location: "", start: "", end: "", details: "" },
    projects: { name: "", role: "", link: "", start: "", end: "", bullets: [] },
    certifications: { name: "", issuer: "", date: "" },
    languages: { name: "", level: "Fluent" },
    awards: { name: "", detail: "" },
    skills: { group: "", items: [] },
  }[list];
}
function rerender(focusSel) {
  const y = window.scrollY;
  const active = focusSel || (document.activeElement?.id ? "#" + CSS.escape(document.activeElement.id) : null);
  render(false);
  window.scrollTo({ top: y });
  if (active) document.querySelector(active)?.focus({ preventScroll: true });
}

function addChips(k, raw) {
  const arr = getPath(k);
  let added = 0;
  for (const v of String(raw).split(/[,;\n]/).map((s) => s.trim()).filter(Boolean)) {
    if (!arr.some((x) => lc(x) === lc(v))) { arr.push(v); added++; }
  }
  return added;
}

document.addEventListener("input", (e) => {
  const t = e.target;
  const k = t.dataset?.k;
  if (!k) return;
  let v = t.type === "checkbox" ? t.checked : t.value;
  if (t.hasAttribute("data-lines")) v = t.value.split("\n").map((s) => s.trim()).filter(Boolean);
  setPath(k, v);
  if (t.getAttribute("aria-invalid")) { t.removeAttribute("aria-invalid"); const er = $(t.id + "-err"); if (er) er.hidden = true; }
  const which = k[0];
  changed(which);
  if (k === "P.summary") {
    const n = words(P.summary), el = $("sum-count");
    if (el) { el.className = n === 0 ? "" : n < 30 || n > 100 ? "warn" : "good"; el.textContent = `${n} words · ${n === 0 ? "Aim for 40–90 words" : n < 30 ? "A little short. Aim for 40–90 words" : n <= 100 ? "Good length" : "Too long. Trim to under 100 words"}`; }
  }
  const lint = /^P\.(experience|projects)\.(\d+)\.bullets$/.exec(k);
  if (lint) { const el = document.querySelector(`[data-lint="${lint[1]}.${lint[2]}"]`); if (el) el.innerHTML = bulletLint(P[lint[1]][+lint[2]].bullets); }
  const summ = /^P\.(experience|education|projects)\.(\d+)\.(title|company|degree|school|name|role|start|end)$/.exec(k);
  if (summ) {
    const it = P[summ[1]][+summ[2]];
    const d = document.querySelector(`details[data-item="${summ[1]}"][data-i="${summ[2]}"] .item-title`);
    const main = summ[1] === "experience" ? it.title || "New job" : summ[1] === "education" ? it.degree || "New qualification" : it.name || "New project";
    const sub = [summ[1] === "experience" ? it.company : summ[1] === "education" ? it.school : it.role, spanText(it)].filter(Boolean).join(" · ") || "Fill in the details below";
    if (d) d.innerHTML = `<b>${esc(main)}</b><span>${esc(sub)}</span>`;
  }
  if (k === "C.country") { /* region chips + sources depend on country */ clearTimeout(timers.country); timers.country = setTimeout(() => { if (lc(C.country) === "bangladesh" && !C.sources.includes("bdjobs")) C.sources.push("bdjobs"); rerender(); }, 600); }
  refreshAside(false);
  const rail = document.querySelector(".rail");
  const step = STEPS[stepIndex(current)];
  if (rail && step) rail.innerHTML = renderRail(step);
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.type === "checkbox" && t.dataset.k) rerender();
  if (t.tagName === "SELECT" && t.dataset.k) { setPath(t.dataset.k, t.value); changed(t.dataset.k[0]); refreshAside(false); }
});

document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t.dataset?.chipInput) {
    const k = t.dataset.chipInput;
    if ((e.key === "Enter" || e.key === ",") && t.value.trim()) {
      e.preventDefault();
      addChips(k, t.value);
      changed(k[0]);
      rerender("#" + CSS.escape(t.id));
    } else if (e.key === "Enter") {
      e.preventDefault();
    } else if (e.key === "Backspace" && !t.value) {
      const arr = getPath(k);
      if (arr.length) { arr.pop(); changed(k[0]); rerender("#" + CSS.escape(t.id)); }
    }
    return;
  }
  if (e.key === "Escape" && ui.sheet) closeSheet();
  if (e.key === "Enter" && t.tagName === "INPUT" && t.type !== "checkbox" && t.closest("#form")) { e.preventDefault(); nextStep(); }
});
document.addEventListener("paste", (e) => {
  const t = e.target;
  if (!t.dataset?.chipInput) return;
  const text = e.clipboardData.getData("text");
  if (/[,;\n]/.test(text)) { e.preventDefault(); addChips(t.dataset.chipInput, text); changed(t.dataset.chipInput[0]); rerender("#" + CSS.escape(t.id)); }
});
document.addEventListener("focusout", (e) => {
  // Typed a chip but clicked away without pressing Enter: keep it.
  const t = e.target;
  if (t.dataset?.chipInput && t.value.trim()) {
    const k = t.dataset.chipInput;
    setTimeout(() => { if (addChips(k, t.value)) { changed(k[0]); rerender(); } }, 120);
  }
});

let undoStash = null;
document.addEventListener("click", (e) => {
  const box = e.target.closest(".chipbox");
  if (box && e.target === box) box.querySelector("input")?.focus();
  const t = e.target.closest("button, a");
  if (!t) { if (e.target.id === "scrim") closeSheet(); return; }
  const d = t.dataset;

  if (d.chipDel !== undefined) {
    const k = t.closest("[data-chips]").dataset.chips;
    const arr = getPath(k);
    const [gone] = arr.splice(+d.chipDel, 1);
    changed(k[0]);
    rerender("#" + CSS.escape(t.closest("[data-chips]").querySelector("input").id));
    toast(`Removed "${gone}"`, () => { arr.splice(+d.chipDel, 0, gone); changed(k[0]); rerender(); });
  } else if (d.chipAdd) {
    addChips(d.chipAdd, d.v); changed(d.chipAdd[0]); rerender();
  } else if (d.add) {
    e.preventDefault();
    const list = P[d.add];
    if (["experience", "education", "projects"].includes(d.add)) list.forEach((x) => (x._open = false));
    list.push(newItem(d.add));
    if (d.add === "skills" && list.length === 2 && !list[0].group) { list[0].group = "Technical"; list[1].group = "Soft skills"; }
    changed("P");
    rerender();
    const first = document.querySelectorAll(`[data-k^="P.${d.add}.${list.length - 1}."]`)[0];
    first?.focus(); first?.scrollIntoView({ block: "center", behavior: "smooth" });
  } else if (d.del) {
    e.preventDefault(); e.stopPropagation();
    const list = P[d.del], i = +d.i;
    const [gone] = list.splice(i, 1);
    if (d.del === "skills" && !list.length) list.push(newItem("skills"));
    if (d.del === "skills" && list.length === 1 && list[0].group === "Technical") list[0].group = "";
    changed("P"); rerender();
    toast("Deleted", () => { list.splice(i, 0, gone); changed("P"); rerender(); });
  } else if (d.move) {
    e.preventDefault(); e.stopPropagation();
    const list = P[d.move], i = +d.i, j = i + +d.d;
    [list[i], list[j]] = [list[j], list[i]];
    changed("P"); rerender();
  } else if (d.toggle) {
    const arr = getPath(d.toggle);
    const i = arr.indexOf(d.v);
    i < 0 ? arr.push(d.v) : arr.splice(i, 1);
    if (d.toggle === "C.levels" && i < 0 && !C.levels.length) C.levels = [d.v];
    changed("C"); rerender();
  } else if (d.set) {
    setPath(d.set, isNaN(+d.v) ? d.v : +d.v); changed(d.set[0]); rerender();
  } else if (d.field) {
    ui.field = d.field; rerender();
  } else if (d.go) {
    go(d.go);
  } else if (d.act === "next") nextStep();
  else if (d.act === "back") prevStep();
  else if (d.act === "open-sheet") openSheet();
  else if (d.act === "close-sheet") closeSheet();
  else if (t.id === "draft-summary") {
    undoStash = P.summary;
    P.summary = draftSummary();
    changed("P"); rerender("#f-P-summary");
    const ta = $("f-P-summary");
    const s = P.summary.indexOf("["); if (ta && s >= 0) ta.setSelectionRange(s, P.summary.length);
    toast("Draft added. Replace the part in brackets.", () => { P.summary = undoStash; changed("P"); rerender(); });
  } else if (t.id === "start" || t.id === "save-only") startSearch(t.id === "start", t);
  else if (t.id === "toast-undo") { const f = toastUndo; hideToast(); f?.(); }
  else if (t.id === "to-jobs" && dirtyCriteria && !confirm("You have unsaved search changes. Leave without saving them?")) e.preventDefault();
});
document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (d.matches?.("details.item")) { const it = P[d.dataset.item]?.[+d.dataset.i]; if (it) it._open = d.open; }
}, true);

async function startSearch(run, btn) {
  const errs = [...vLevel(), ...vRoles(), ...vLocation()];
  if (errs.length) return;
  btn.disabled = true;
  btn.innerHTML = `${icon("clock").replace('class="i"', 'class="i spin"')}${run ? "Starting" : "Saving"}`;
  C.complete = true;
  C.sources = C.sources.filter((s) => { const d = SOURCES.find((x) => x.id === s); return !(d.country && lc(C.country) !== d.country); });
  const res = await saveNow("C", { apply: true });
  if (!res) { btn.disabled = false; btn.textContent = "Try again"; return; }
  if (run) await fetch("/api/scrape", { method: "POST" }).catch(() => {});
  location.href = "/";
}

/* Sheet (preview on small screens) */
function openSheet() { ui.sheet = true; document.body.classList.add("sheet-open"); refreshAside(true); }
function closeSheet() { if (!ui.sheet) return; ui.sheet = false; document.body.classList.remove("sheet-open"); refreshAside(false); }

/* Toast with undo */
let toastTimer, toastUndo;
function toast(msg, undo) {
  $("toast-msg").textContent = msg;
  toastUndo = undo;
  $("toast-undo").hidden = !undo;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() { $("toast").classList.remove("show"); toastUndo = null; }

window.addEventListener("resize", fitPaper);
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", (e) => { if (dirtyCriteria) { e.preventDefault(); e.returnValue = ""; } });

/* ======================================================================
   Boot
   ====================================================================== */
(async function boot() {
  let s;
  try { s = await (await fetch("/api/state")).json(); }
  catch { $("app").innerHTML = `<main class="welcome"><div><h1>Job Hunt isn't running.</h1><p class="lead">Double-click "Start Job Hunt.bat" to start it, then refresh this page.</p></div></main>`; return; }
  DEF = s.defaults;
  P = Object.assign(clone(DEF.profile), s.profile || {});
  P.personal = Object.assign(clone(DEF.profile.personal), P.personal || {});
  if (!P.skills.length) P.skills = [{ group: "", items: [] }];
  [P.experience, P.education, P.projects].forEach((l) => l.length > 1 && l.forEach((x) => (x._open = false)));
  criteriaExisted = !!s.criteria;
  C = Object.assign(clone(DEF.criteria), s.criteria || {});
  route();
})();
</script>
